<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="login-box">

            <h2 id="formTitle">Welcome Back</h2>
            <p id="formSubtitle">Login to your account</p>

            <form id="authForm">

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                    minlength="3"
                    maxlength="30"
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                    minlength="8"
                >

                <button type="submit" id="submitButton">
                    Login
                </button>

            </form>

            <p id="message"></p>

            <p class="switch-text">
                <span id="switchLabel">Don't have an account?</span>
                <a href="#" id="switchMode">Register</a>
            </p>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
